[package]
name = "imgtool"
version = "0.1.1"
edition = "2021"
description = "Fast image viewer and quick annotation tool inspired by ksnip"
license = "MIT"
repository = "https://github.com/manhavn/imgtool"

[[bin]]
name = "imgtool"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
epaint_default_fonts = "0.36.2"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "ico",
    "tiff",
] }
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
open = "5.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSGeometry",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
